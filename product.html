<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff">
<meta name="description" content="View product details, photos, sizes and price at Nur Fashion House. Order fashion in Bangladesh.">
<meta name="robots" content="index,follow">
<title>Product | Nur Fashion House</title>
<link rel="canonical" href="https://sohugrana90.github.io/">
<meta property="og:site_name" content="Nur Fashion House">
<meta property="og:type" content="product">
<meta property="og:title" content="Product | Nur Fashion House">
<meta property="og:description" content="Explore product details at Nur Fashion House.">
<meta property="og:url" content="https://sohugrana90.github.io/">
<meta property="og:image" content="https://sohugrana90.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.detail-page{min-height:65vh;padding:45px 0 70px}.detail-breadcrumb{font-size:11px;color:#777;margin-bottom:25px}.detail-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:55px}.detail-gallery{background:#f5f1e9;padding:22px}.detail-main-image{width:100%;height:560px;object-fit:contain;display:block}.detail-thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.detail-thumbs button{width:66px;height:72px;padding:3px;border:1px solid #e9e5dd;background:#fff}.detail-thumbs img{width:100%;height:100%;object-fit:cover}.detail-copy{align-self:center}.detail-copy h1{font:500 clamp(30px,4vw,48px)/1.15 "Playfair Display",Georgia,serif;margin:8px 0 15px}.detail-price{font-size:21px;font-weight:700}.detail-description{color:#777;line-height:1.9;margin:24px 0}.detail-size-label{display:block;font-size:10px;letter-spacing:1px;font-weight:700;margin:20px 0}.detail-size-label select{display:block;width:100%;padding:12px;margin-top:8px;border:1px solid #e9e5dd;background:white}.detail-order{width:100%;margin-top:12px}.detail-error{text-align:center;padding:70px 15px;color:#777}.detail-copy .product-category{margin-bottom:10px}
@media(max-width:700px){.detail-page{padding:28px 0 45px}.detail-layout{grid-template-columns:1fr;gap:25px}.detail-main-image{height:55vh;max-height:460px}.detail-gallery{padding:12px}.detail-copy{padding:0 5px}}
</style>
</head>
<body>
<div class="top-strip">NUR FASHION HOUSE <span>✦</span> SHOP THE COLLECTION <span>✦</span> EASY WHATSAPP ORDERING</div>
<header class="header"><div class="header-main wrap"><a class="logo" href="index.html"><span class="logo-mark">N</span><span>NUR<small>FASHION HOUSE</small></span></a><div class="header-tools"><a class="tool-link" href="index.html#shop">CONTINUE SHOPPING</a></div></div></header>
<main class="wrap detail-page">
<div class="detail-breadcrumb"><a href="index.html">Home</a> / <a href="index.html#shop">Shop</a> / <span id="crumbName">Product</span></div>
<div id="productDetail"><div class="loading-state">Loading product details…</div></div>
</main>
<footer class="footer"><div class="wrap footer-main"><a class="logo" href="index.html"><span class="logo-mark">N</span><span>NUR<small>FASHION HOUSE</small></span></a><p>Elegance in every detail.</p><a href="index.html#shop">Shop collection ↗</a></div><div class="wrap footer-bottom"><span>© <span id="year"></span> Nur Fashion House. All rights reserved.</span><span>MADE WITH CARE · BANGLADESH</span></div></footer>
<script>
// Dynamic SEO product detail page for Nur Fashion House
const SUPABASE_URL="https://icpklfqzrfceaazhashh.supabase.co";
const SUPABASE_KEY="sb_publishable_u_zCC7ueb8VGJYr9KzXZbg_gPHxRK1O";
const STORE_WHATSAPP="8801722574666";
const root=document.getElementById("productDetail");
const money=v=>"৳"+Number(v||0).toLocaleString("en-BD");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function images(p){let a=p.image_urls;if(typeof a==="string"){try{a=JSON.parse(a)}catch{a=[a]}}a=Array.isArray(a)?a.filter(x=>typeof x==="string"&&x.trim()):[];if(p.image_url&&!a.includes(p.image_url))a.unshift(p.image_url);return [...new Set(a)]}
function setMeta(name,content,property=false){let selector=property?'meta[property="'+name+'"]':'meta[name="'+name+'"]';let el=document.querySelector(selector);if(!el){el=document.createElement("meta");el.setAttribute(property?"property":"name",name);document.head.appendChild(el)}el.content=content}
function setProductSEO(p,imgs){
 const title=(p.name||"Fashion Product")+" | Nur Fashion House";
 const desc=String(p.description||("Shop "+(p.name||"this product")+" at Nur Fashion House in Bangladesh.")).replace(/\s+/g," ").slice(0,300);
 const canonical=location.origin+location.pathname+location.search;
 document.title=title;
 setMeta("description",desc);
 let link=document.querySelector('link[rel="canonical"]');if(link)link.href=canonical;
 setMeta("og:title",title,true);setMeta("og:description",desc,true);setMeta("og:url",canonical,true);if(imgs[0])setMeta("og:image",imgs[0],true);
 const schema={"@context":"https://schema.org","@type":"Product","name":p.name||"Nur Fashion House Product","description":desc,"image":imgs,"sku":String(p.id),"brand":{"@type":"Brand","name":"Nur Fashion House"},"category":p.category||"Fashion","offers":{"@type":"Offer","url":canonical,"priceCurrency":"BDT","price":String(Number(p.price||0)),"itemCondition":"https://schema.org/NewCondition"}};
 if(p.name_bn)schema.alternateName=p.name_bn;
 let ld=document.getElementById("product-jsonld");if(!ld){ld=document.createElement("script");ld.type="application/ld+json";ld.id="product-jsonld";document.head.appendChild(ld)}ld.textContent=JSON.stringify(schema);
}
function render(p){
 const imgs=images(p),sizes=Array.isArray(p.sizes)&&p.sizes.length?p.sizes:["Free"];
 setProductSEO(p,imgs);document.getElementById("crumbName").textContent=p.name||"Product";
 const msg=()=>{const size=document.getElementById("detailSize").value;const text="Hello Nur Fashion House! I want to order: "+p.name+" | Size: "+size+" | Price: "+money(p.price)+". Please confirm availability and delivery charge.";window.open("https://wa.me/"+STORE_WHATSAPP+"?text="+encodeURIComponent(text),"_blank","noopener,noreferrer")};
 root.innerHTML='<div class="detail-layout"><div class="detail-gallery">'+(imgs[0]?'<img class="detail-main-image" id="detailMainImage" src="'+esc(imgs[0])+'" alt="'+esc(p.name)+'" fetchpriority="high">':'<div class="detail-main-image" style="display:grid;place-items:center">NUR</div>')+'<div class="detail-thumbs">'+imgs.map((u,i)=>'<button type="button" data-photo="'+i+'" aria-label="View product photo '+(i+1)+'"><img src="'+esc(u)+'" alt="'+esc(p.name)+' photo '+(i+1)+'" loading="lazy"></button>').join("")+'</div></div><section class="detail-copy"><p class="kicker">'+esc(p.category||"NUR COLLECTION")+'</p><h1>'+esc(p.name)+'</h1><div class="detail-price">'+money(p.price)+'</div><p class="detail-description">'+esc(p.description||"A considered piece from the Nur Fashion House collection.")+'</p><label class="detail-size-label">SELECT SIZE<select id="detailSize">'+sizes.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join("")+'</select></label><button class="dark-button detail-order" id="detailOrder">ORDER VIA WHATSAPP ↗</button><p class="modal-note">We will confirm product availability and delivery charge with you.</p></section></div>';
 document.getElementById("detailOrder").addEventListener("click",msg);
 root.querySelector(".detail-thumbs").addEventListener("click",e=>{const b=e.target.closest("[data-photo]");if(!b)return;const url=imgs[Number(b.dataset.photo)];const main=document.getElementById("detailMainImage");if(main&&url)main.src=url});
}
async function init(){
 document.getElementById("year").textContent=new Date().getFullYear();
 const id=new URLSearchParams(location.search).get("id");
 if(!id){root.innerHTML='<div class="detail-error">Product link is missing an ID. <a href="index.html#shop">Return to shop</a>.</div>';return}
 try{
  const url=SUPABASE_URL+"/rest/v1/products?id=eq."+encodeURIComponent(id)+"&active=eq.true&select=*";
  const response=await fetch(url,{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Accept":"application/json"},cache:"no-store"});
  const body=await response.text();
  if(!response.ok)throw new Error("Database error "+response.status+": "+body.slice(0,250));
  const rows=JSON.parse(body);
  if(!Array.isArray(rows)||!rows.length)throw new Error("Product not found or inactive.");
  render(rows[0]);
 }catch(e){
  console.error("Nur Fashion House product details:",e);
  root.innerHTML='<div class="detail-error"><strong>Product details could not load</strong><p>'+esc(e.message||"Unknown error")+'</p><p><a href="index.html#shop">Return to shop</a></p></div>';
 }
}
window.setTimeout(()=>{if(root&&root.textContent.includes("Loading product details"))root.innerHTML='<div class="detail-error">Product script did not start. Please press Ctrl+Shift+R.</div>'},12000);
init();
</script>
</body></html>
